name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Qbc_${{ github.run_id }}!aA
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Qbc_${{ github.run_id }}!aA' -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test backend
        env:
          QBC_TEST_SQLSERVER_CONNECTION_STRING: >-
            Server=localhost,1433;User ID=sa;Password=Qbc_${{ github.run_id }}!aA;Encrypt=False;TrustServerCertificate=True;Connect Timeout=30
        run: dotnet test backend/Qbc.Workboard.slnx --configuration Release
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: Run browser acceptance tests
        working-directory: frontend
        run: npm run test:e2e
      # SourceRevisionId is appended to the assembly's informational version, which is what
      # /api/version reports. The SDK would infer it from the checkout, but the artifact
      # should name the exact commit this run built rather than whatever HEAD resolves to.
      - name: Publish single-host application
        run: dotnet publish backend/src/Qbc.Workboard.Api/Qbc.Workboard.Api.csproj --configuration Release --output artifacts/publish -p:SourceRevisionId=${{ github.sha }}
      - name: Upload Workboard publish artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: workboard-publish
          path: artifacts/publish
          if-no-files-found: error
          retention-days: 7

  design-system:
    name: Design-system contract and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - name: Restore design-system dependencies
        working-directory: design-system
        run: npm ci
      - name: Install Playwright browsers
        working-directory: design-system
        run: npx playwright install --with-deps chromium
      - name: Validate contract and run browser tests
        working-directory: design-system
        run: npm test

  deploy-workboard:
    name: Deploy Workboard to Azure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, design-system]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-workboard-azure
      cancel-in-progress: false
    environment:
      name: workboard-azure
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified Workboard artifact
        uses: actions/download-artifact@v4
        with:
          name: workboard-publish
          path: artifacts/publish
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Workboard
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: artifacts/publish
