name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test backend
        run: dotnet test backend/Qbc.Workboard.slnx --configuration Release
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: Run browser acceptance tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Publish single-host application
        run: dotnet publish backend/src/Qbc.Workboard.Api/Qbc.Workboard.Api.csproj --configuration Release --output artifacts/publish

  design-system:
    name: Design-system contract and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - name: Restore design-system dependencies
        working-directory: design-system
        run: npm ci
      - name: Install Playwright browsers
        working-directory: design-system
        run: npx playwright install --with-deps chromium
      - name: Validate contract and run browser tests
        working-directory: design-system
        run: npm test
