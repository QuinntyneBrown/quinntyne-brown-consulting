<div
  class="segmented"
  role="group"
  [attr.aria-label]="ariaLabel()"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      [attr.aria-pressed]="option.value === selected()"
      [attr.title]="option.title ?? null"
      (click)="choose(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
