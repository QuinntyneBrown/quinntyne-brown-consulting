<!-- The click only closes on a backdrop click; keyboard users close with Escape or the close button. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialog
  [class.sm]="size() === 'sm'"
  [attr.aria-labelledby]="titleId"
  (cancel)="cancel($event)"
  (click)="backdrop($event)"
>
  <div class="shell">
    <header>
      <div>
        <h2 [id]="titleId">{{ title() }}</h2>
        @if (subtitle()) {
          <p>{{ subtitle() }}</p>
        }
      </div>
      <qbc-icon-button
        icon="close"
        [label]="closeLabel()"
        variant="bare"
        (click)="close('close')"
      />
    </header>
    <div class="body"><ng-content select="[body]" /></div>
    <footer><ng-content select="[actions]" /></footer>
  </div>
</dialog>
