@if (label()) {
  <label [for]="controlId"
    >{{ label() }}
    @if (required()) {
      <span aria-hidden="true">*</span>
    }
  </label>
}
<textarea
  [id]="controlId"
  [value]="controlValue()"
  [placeholder]="placeholder()"
  [required]="required()"
  [readOnly]="readonly()"
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-describedby]="hint() ? hintId : null"
  (input)="change($any($event.target).value)"
  (blur)="touched()"
></textarea>
@if (hint()) {
  <small [id]="hintId">{{ hint() }}</small>
}
