<div
  class="zone"
  [class.compact]="variant() === 'compact'"
  [class.is-dragging]="isDragging()"
  [class.is-disabled]="disabled()"
  (dragenter)="dragEnter($event)"
  (dragover)="dragOver($event)"
  (dragleave)="dragLeave($event)"
  (drop)="drop($event)"
>
  @if (variant() === 'compact') {
    <qbc-icon
      class="mark"
      name="upload"
      [size]="16"
    />
    <p class="line">
      <span class="heading">{{ heading() }}</span>
      <span class="or">or</span>
      <button
        class="choose"
        type="button"
        [disabled]="disabled()"
        [attr.aria-describedby]="hint() ? controlId + '-hint' : null"
        (click)="choose()"
      >
        {{ chooseLabel() }}
      </button>
    </p>
    @if (hint()) {
      <p
        class="hint"
        [id]="controlId + '-hint'"
      >
        {{ hint() }}
      </p>
    }
  } @else {
    <qbc-icon
      class="mark"
      name="upload"
      [size]="22"
    />
    <h3 class="heading">{{ heading() }}</h3>
    <button
      class="choose"
      type="button"
      [disabled]="disabled()"
      [attr.aria-describedby]="hint() ? controlId + '-hint' : null"
      (click)="choose()"
    >
      {{ chooseLabel() }}
    </button>
    @if (hint()) {
      <p
        class="hint"
        [id]="controlId + '-hint'"
      >
        {{ hint() }}
      </p>
    }
  }
  <label
    class="visually-hidden"
    [for]="controlId"
    >{{ inputLabel() }}</label
  >
  <input
    #field
    class="visually-hidden"
    type="file"
    multiple
    data-testid="file-drop-input"
    [id]="controlId"
    [disabled]="disabled()"
    (change)="selected(field)"
  />
</div>
