<article>
  <div class="identity">
    <span>{{ storyKey() }}</span>
    <div>
      <strong>{{ title() }}</strong
      ><small>{{ context() }}</small>
    </div>
  </div>
  <div><small>State</small><ng-content select="[state]" /></div>
  <div><small>Estimate</small><ng-content select="[estimate]" /></div>
  <div class="owner"><small>Owner</small><ng-content select="[owner]" /></div>
  <div><small>Sprint</small><ng-content select="[sprint]" /></div>
  <div class="actions"><ng-content select="[actions]" /></div>
</article>
