@if (state() === 'loading') {
  <qbc-loading-state>Loading the markdown editor…</qbc-loading-state>
}
@if (state() === 'failed') {
  <qbc-form-error
    >The markdown editor could not be loaded. Reload the page to write this brief.</qbc-form-error
  >
}
<div
  class="editor-host"
  [class.is-hidden]="state() === 'failed'"
  #host
></div>
