<qbc-back-link
  href="/initiatives"
  label="All initiatives"
/>

<qbc-page-header
  [title]="title()"
  description="An initiative is a name and the outcome it is pursuing, written as markdown."
>
  <span
    actions
    class="save-state"
    role="status"
    aria-label="Brief save state"
    [class.is-dirty]="dirty()"
    >{{ dirty() ? 'Unsaved changes' : 'Saved' }}</span
  >
  <qbc-button
    actions
    variant="secondary"
    [disabled]="!dirty()"
    (click)="discard()"
    >Discard</qbc-button
  >
  <qbc-button
    actions
    [disabled]="pending()"
    (click)="save()"
    >Save initiative</qbc-button
  >
</qbc-page-header>

@if (formError()) {
  <qbc-form-error>{{ formError() }}</qbc-form-error>
}
@if (error()) {
  <qbc-form-error>{{ error() }}</qbc-form-error>
}

@if (loadingState() === 'loading' && !isNew()) {
  <qbc-loading-state>Loading the initiative…</qbc-loading-state>
}

<app-document-editor
  [(value)]="draftBrief"
  sourceLabel="Initiative brief, markdown source"
  emptyTitle="This brief is empty"
  emptyHint="Start from the outcome template, or write the outcome in your own words."
  [template]="briefTemplate"
  templateLabel="Insert the outcome brief template"
>
  <qbc-text-input
    fields
    label="Initiative name"
    placeholder="Name the outcome"
    [required]="true"
    [full]="true"
    [value]="draftName()"
    (valueChange)="draftName.set($event)"
  />
</app-document-editor>

<app-unsaved-changes-dialog
  (keepEditing)="keepEditing()"
  (discardChanges)="discardAndLeave()"
  (saveAndContinue)="saveAndLeave()"
  (dismissed)="onGuardDismissed()"
/>
