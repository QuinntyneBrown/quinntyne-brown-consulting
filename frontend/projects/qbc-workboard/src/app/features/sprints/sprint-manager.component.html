<qbc-dialog
  #dialog
  title="Manage sprints"
  subtitle="Plan focused, two-week delivery intervals with a clear goal."
>
  <div body>
    @if (planning.error()) {
      <qbc-form-error>{{ planning.error() }}</qbc-form-error>
    }
    <div class="manager-head">
      <h3>Sprints</h3>
      <qbc-button (click)="openForm()">＋ New sprint</qbc-button>
    </div>
    <div class="sprint-list">
      @for (sprint of planning.sprints(); track sprint.id) {
        <qbc-sprint-row
          [name]="sprint.name"
          [status]="sprint.status"
          [goal]="sprint.goal"
          [meta]="formatDates(sprint) + ' · ' + sprint.storyCount + ' stories'"
        >
          @if (sprint.status === 'planned') {
            <qbc-button
              actions
              variant="secondary"
              size="sm"
              (click)="start(sprint)"
              >Start</qbc-button
            >
          }
          <qbc-button
            actions
            variant="quiet"
            size="sm"
            (click)="openForm(sprint)"
            >Edit</qbc-button
          >
          @if (sprint.status === 'planned') {
            <qbc-button
              actions
              variant="danger"
              size="sm"
              (click)="delete(sprint)"
              >Delete</qbc-button
            >
          }
        </qbc-sprint-row>
      } @empty {
        <qbc-empty-state
          [bare]="true"
          title="No sprints yet"
          description="Create a sprint and give it a delivery goal."
        />
      }
    </div>
  </div>
  <qbc-button
    actions
    variant="secondary"
    (click)="dialog.close()"
    >Close</qbc-button
  >
</qbc-dialog>

<form
  [formGroup]="form"
  (ngSubmit)="save()"
>
  <qbc-dialog
    #formDialog
    [title]="sprintId() ? 'Edit sprint' : 'New sprint'"
    subtitle="The end date is always 13 calendar days after the start date."
  >
    @if (formError()) {
      <qbc-form-error body>{{ formError() }}</qbc-form-error>
    }
    <qbc-form-grid body>
      <qbc-text-input
        label="Name"
        [required]="true"
        [full]="true"
        formControlName="name"
      />
      <qbc-textarea
        label="Goal"
        [required]="true"
        [full]="true"
        formControlName="goal"
      />
      <qbc-text-input
        label="Start date"
        type="date"
        [required]="true"
        [readonly]="editingCompleted()"
        formControlName="startDate"
      />
    </qbc-form-grid>
    <qbc-button
      actions
      variant="secondary"
      (click)="formDialog.close()"
      >Cancel</qbc-button
    >
    <qbc-button
      actions
      type="submit"
      [disabled]="pending()"
      >Save sprint</qbc-button
    >
  </qbc-dialog>
</form>
<qbc-confirm-dialog />
