<a class="skip-link" href="#main-content">Skip to content</a>
<app-workspace-navigation [open]="menuOpen()" (navigated)="menuOpen.set(false)" />
<div class="workspace">
  <header class="topbar">
    <button class="mobile-nav-button" type="button" aria-label="Open navigation" [attr.aria-expanded]="menuOpen()" (click)="menuOpen.set(!menuOpen())">☰</button>
    <div class="breadcrumb">Workspace / {{ routeName() }}</div>
    <button class="primary-button" type="button" (click)="openNewStory()"><span aria-hidden="true">＋</span> New story</button>
  </header>
  <main id="main-content" tabindex="-1"><router-outlet /></main>
</div>
@if (feedback.message(); as message) {
  <div class="toast-region" aria-live="polite" aria-atomic="true">
    <div class="toast" [class.error]="message.kind === 'error'">{{ message.text }}</div>
  </div>
}
